<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef7ff">
  <title>ركائز | بصمة الموظف</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" class="boot"><i class="fa-solid fa-fingerprint"></i><span></span><p>نجهّز بوابة الموظف...</p></div>
  <main id="pin-page" class="pin-page hidden">
    <section class="pin-card"><div class="portal-mark"><i class="fa-solid fa-fingerprint"></i></div><span>ركائز للموظفين</span><h1>دخول البصمة</h1><p>أدخل رمز دخول البصمة الخاص بك</p><form id="pin-form"><input id="pin-code" inputmode="numeric" minlength="4" maxlength="8" placeholder="• • • •" autocomplete="one-time-code" required><button>دخول آمن</button><small id="pin-message"></small></form></section>
  </main>
  <main id="employee-app" class="employee-app hidden"></main>
  <div id="portal-toast" class="portal-toast hidden"></div>
  <div id="portal-loading" class="portal-loading hidden"><div><i class="fa-solid fa-fingerprint"></i><span></span><h3>يرجى الانتظار</h3><p>يتم حفظ بياناتك...</p></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
